<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the Date — Kathrin & Philipp</title>
<style>
  @font-face { font-family: "Luxurious Script"; src: url(assets/fonts/luxurious-script-latin.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Jost"; src: url(assets/fonts/jost-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Roboto Serif Cond"; src: url(assets/fonts/roboto-serif-cond-700-latin.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #37493a;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* Desktop: play the video/finale in a centered half-width column instead of full-bleed */
  @media (min-width: 900px) {
    #stage {
      left: 50%;
      right: auto;
      top: 0;
      bottom: 0;
      width: 50vw;
      transform: translateX(-50%);
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.45);
    }
  }

  /* --- Poster (Standbild) --- */
  #poster {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
    z-index: 3;
    transition: opacity 0.5s ease;
  }
  #poster::after { content: ""; }
  #hint {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    z-index: 4;
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    opacity: 0.9;
    animation: pulse 2s ease-in-out infinite;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #hint.hidden {
    animation: none;
    opacity: 0 !important;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  /* --- Video --- */
  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #video.visible { opacity: 1; z-index: 5; }
  #video.fading-out { opacity: 0; transition: opacity 2.2s ease-in-out; }

  /* --- Finale Save-the-Date Seite (Design-Raster 1080 x 1920, skaliert) --- */
  #finale {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #ece9e2;
    container-type: size;
    --u: min(calc(100cqw / 1080), calc(100cqh / 1920));
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: opacity 2.2s ease-in-out;
    overflow: hidden;
  }
  #finale.visible { opacity: 1; z-index: 6; pointer-events: auto; }

  .canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(1080 * var(--u));
    height: calc(1920 * var(--u));
    transform: translate(-50%, -50%);
  }

  .t {
    position: absolute;
    left: 0;
    width: 100%;
    text-align: center;
    white-space: nowrap;
    line-height: 1;
    transform: translateY(-50%);
    color: #2e2e2e;
    font-family: "Jost", "Century Gothic", Arial, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
  }
  #t-wir  { top: calc(470 * var(--u)); font-size: calc(36 * var(--u)); letter-spacing: 0.1em; }
  #t-date { top: calc(555 * var(--u)); font-size: calc(86 * var(--u)); letter-spacing: 0; transform: translateY(-50%) scaleX(0.84);
            font-family: "Roboto Serif Cond", Georgia, "Times New Roman", serif; font-weight: 700; }
  #t-names { top: calc(655 * var(--u)); font-size: calc(38 * var(--u)); letter-spacing: 0.06em; }
  #t-info { top: calc(1867 * var(--u)); font-size: calc(34 * var(--u)); letter-spacing: 0.08em; }

  .heart {
    position: absolute;
    left: calc(445 * var(--u));
    top: calc(105 * var(--u));
    width: calc(190 * var(--u));
    height: calc(240 * var(--u));
    overflow: visible;
    filter:
      drop-shadow(calc(var(--u) * -2) calc(var(--u) * -2) calc(var(--u) * 1.5) rgba(255, 255, 255, 0.95))
      drop-shadow(calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 4) rgba(110, 104, 92, 0.35));
  }

  .script {
    position: absolute;
    white-space: nowrap;
    line-height: 1;
    font-family: "Luxurious Script", "Snell Roundhand", cursive;
    font-size: calc(600 * var(--u));
    transform-origin: 0 0;
    transform: scaleX(1.16);
    color: #f2f0eb;
    text-shadow:
      calc(var(--u) * -3) calc(var(--u) * -3) calc(var(--u) * 3) rgba(255, 255, 255, 0.95),
      calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 6) rgba(110, 104, 92, 0.38),
      calc(var(--u) * 8) calc(var(--u) * 12) calc(var(--u) * 18) rgba(110, 104, 92, 0.12);
  }
  #s-save { left: calc(0 * var(--u)); top: calc(665 * var(--u)); }
  #s-the  { left: calc(595 * var(--u)); top: calc(950 * var(--u)); }
  #s-date { left: calc(20 * var(--u)); top: calc(1255 * var(--u)); transform: scaleX(1.3); }
</style>
</head>
<body>

<div id="stage">
  <img id="poster" src="assets/poster.jpg" alt="Video Standbild – zum Abspielen tippen">
  <div id="hint">Öffne mich</div>

  <video id="video" src="assets/video.mp4" playsinline preload="auto"></video>

  <div id="finale">
    <div class="canvas">
      <svg class="heart" viewBox="0 0 200 250" fill="none" stroke="#f2f0eb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M100 240 C62 192 10 142 8 82 C6 36 62 18 86 56 C93 67 97 80 99 96 C107 62 132 26 166 13 C192 4 196 42 186 76 C171 132 132 190 100 240 Z"/>
      </svg>
      <div class="t" id="t-wir">Wir heiraten!</div>
      <div class="t" id="t-date">25. September 2027</div>
      <div class="t" id="t-names">Kathrin &amp; Philipp</div>
      <div class="script" id="s-save">Save</div>
      <div class="script" id="s-the">the</div>
      <div class="script" id="s-date">date</div>
      <div class="t" id="t-info">Weitere Infos folgen</div>
    </div>
  </div>
</div>

<script>
  const poster = document.getElementById('poster');
  const hint = document.getElementById('hint');
  const video = document.getElementById('video');
  const finale = document.getElementById('finale');
  let started = false;

  function startVideo() {
    if (started) return;
    started = true;
    poster.style.opacity = '0';
    hint.classList.add('hidden');
    video.classList.add('visible');
    video.currentTime = 0;
    video.play().catch(() => {});
  }

  document.getElementById('stage').addEventListener('click', startVideo);
  document.getElementById('stage').addEventListener('touchend', function(e){
    e.preventDefault();
    startVideo();
  }, { passive: false });

  video.addEventListener('ended', function () {
    finale.classList.add('visible');
    video.classList.add('fading-out');
  });
</script>

</body>
</html>
